name: Release macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.27.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    env:
      SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set release version
        run: node scripts/sync-version-from-tag.mjs "v${{ inputs.version }}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS bundle
        run: npm run tauri build -- --bundles dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      - name: Verify signature and notarization
        if: env.SIGNING_CONFIGURED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          if [[ -z "$APP" ]]; then
            echo "No .app produced to verify" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vvv -t install "$APP"
          xcrun stapler validate "$APP"

      - name: Publish DMG to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)
          if [[ -z "$DMG" ]]; then
            echo "No DMG produced under src-tauri/target/release/bundle/dmg" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — attaching the DMG to it."
          else
            gh release create "$TAG" \
              --title "Gitty $TAG" \
              --notes-file .github/release-notes-macos.md \
              || echo "Release was created concurrently — continuing to upload."
          fi
          gh release upload "$TAG" "$DMG" --clobber
