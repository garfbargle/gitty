<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Try Gitty's keyboard-first Git workflow in your browser." />
    <title>Gitty — Try the demo</title>

    <!-- Link previews. Without these, a link to the demo unfurls as a bare URL
         in Slack, Discord, iMessage and every social card, so nothing about it
         says Gitty. The image is an absolute URL because crawlers do not
         resolve relative paths, and it is the same artwork used for the
         repository's social preview so a link to either place looks like the
         same product. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gitty" />
    <meta property="og:title" content="Gitty — keyboard-first Git" />
    <meta
      property="og:description"
      content="Stage, review, commit and push without leaving the keyboard. Try the browser demo."
    />
    <meta property="og:url" content="https://gitty.c0di.com/" />
    <meta property="og:image" content="https://gitty.c0di.com/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Gitty, showing its empty state with nothing left to commit." />

    <!-- summary_large_image rather than the default summary: the default crops
         to a small square, which loses the app entirely. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gitty — keyboard-first Git" />
    <meta
      name="twitter:description"
      content="Stage, review, commit and push without leaving the keyboard. Try the browser demo."
    />
    <meta name="twitter:image" content="https://gitty.c0di.com/social-preview.png" />

    <meta name="theme-color" content="#12161e" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
